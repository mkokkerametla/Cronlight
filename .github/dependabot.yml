# Version updates are paused: open-pull-requests-limit 0 stops new pull requests.
# Remove those lines to turn them back on.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      quartz:
        patterns: ["Quartz*"]
      test-and-sample:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Npgsql", "MySqlConnector", "Microsoft.Data.*", "SQLitePCLRaw*"]

  - package-ecosystem: npm
    directory: /src/Cronlight.UI
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      ui:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
