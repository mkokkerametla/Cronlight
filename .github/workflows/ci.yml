name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this same pipeline with the tag's version
  workflow_call:
    inputs:
      version:
        description: Package version to build, e.g. 1.2.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Superseded pushes to the same branch or PR are cancelled; release runs never are
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  ui:
    name: UI lint, type-check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Cronlight.UI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Cronlight.UI/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: ESLint and TypeScript
        run: npm run lint
      - name: Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - name: Unit and component tests
        run: npm test

  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real databases for the history and dashboard tests; SQLite and in-memory need nothing
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: Cronlight_Test1
          POSTGRES_DB: quartz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: Cronlight_Test1
          MYSQL_DATABASE: quartz
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pCronlight_Test1"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Cronlight_Test1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Cronlight_Test1 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 20s

    env:
      QUARTZ_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=quartz;Username=postgres;Password=Cronlight_Test1
      QUARTZ_TEST_MYSQL: Server=127.0.0.1;Port=3306;Database=quartz;User Id=root;Password=Cronlight_Test1;AllowUserVariables=true
      QUARTZ_TEST_SQLSERVER: Server=127.0.0.1,1433;Database=quartz;User Id=sa;Password=Cronlight_Test1;TrustServerCertificate=true
      CRONLIGHT_REQUIRE_DATABASES: "true"
      # Release runs pass the tag's version; everything else gets a unique prerelease version
      VERSION: ${{ inputs.version || format('0.1.0-ci.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The library build runs `npm ci` and `npm run build` for the embedded UI
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Cronlight.UI/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          # The .NET 8 runtime runs the net8.0 consumer app in the package smoke test
          dotnet-version: 8.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Create SQL Server database
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Cronlight_Test1 \
            -Q "IF DB_ID('quartz') IS NULL CREATE DATABASE quartz"

      - run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: >-
          dotnet test --configuration Release --no-build
          --logger trx --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Pack
        run: |
          dotnet pack src/Cronlight --configuration Release --no-build -p:Version="$VERSION" --output artifacts
          dotnet pack src/Cronlight.History --configuration Release --no-build -p:Version="$VERSION" --output artifacts

      - name: Verify packages
        run: ./build/verify-packages.sh artifacts "$VERSION"

      - name: Smoke test packages in a consumer app
        run: ./build/smoke-test.sh artifacts "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/Cronlight.E2E
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/Cronlight.UI/package-lock.json
            tests/Cronlight.E2E/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts the sample host (dotnet run, which also builds the UI) on a fresh SQLite database
      - name: Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/Cronlight.E2E/playwright-report
            tests/Cronlight.E2E/test-results
          retention-days: 14
